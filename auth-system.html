function Field({ label, value, onChange, type = "text", placeholder = "", error = "", disabled = false }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 11, color: T.muted, fontWeight: 800, letterSpacing: ".7px", textTransform: "uppercase", marginBottom: 6 }}>{label}</div>
      <input
        style={{ ...inputStyle, borderColor: error ? T.accent : T.border }}
        type={type}
        placeholder={placeholder}
        value={value}
        onChange={e => onChange(e.target.value)}
        disabled={disabled}
      />
      {error && <div style={{ color: T.accent, fontSize: 12, marginTop: 4 }}>{error}</div>}
    </div>
  );
}

function FileUpload({ label, bucket, path, onUpload, accept = "image/*" }) {
  const [uploading, setUploading] = useState(false);
  const [done, setDone] = useState(false);
  const ref = useRef();

  const handle = async (e) => {
    const file = e.target.files[0];
    if (!file || !supabase) return;

    setUploading(true);
    try {
      const ext = file.name.split(".").pop();
      const fp = `${path}-${Date.now()}.${ext}`;
      const { error } = await supabase.storage.from(bucket).upload(fp, file, { upsert: false });
      if (error) throw error;

      const { data } = supabase.storage.from(bucket).getPublicUrl(fp);
      setDone(true);
      onUpload(data.publicUrl || fp);
    } catch (err) {
      alert("Upload failed: " + err.message);
    }
    setUploading(false);
  };

  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 11, color: T.muted, fontWeight: 800, letterSpacing: ".7px", textTransform: "uppercase", marginBottom: 6 }}>{label}</div>
      <div onClick={() => ref.current?.click()} style={{ border: `2px dashed ${done ? T.green : T.border}`, borderRadius: 10, padding: 16, textAlign: "center", cursor: "pointer", background: T.surface }}>
        <input ref={ref} type="file" accept={accept} style={{ display: "none" }} onChange={handle} />
        {uploading ? "⏳ Uploading..." : done ? "✅ Uploaded" : `📎 Upload ${label}`}
      </div>
    </div>
  );
}

async function uniqueCheck(table, email, phone) {
  const { data: existingEmail } = await supabase.from(table).select("id").eq("email", email).maybeSingle();
  if (existingEmail) throw new Error("Email sa deja gen kont");

  if (phone) {
    const { data: existingPhone } = await supabase.from(table).select("id").eq("phone", phone).maybeSingle();
    if (existingPhone) throw new Error("Numero sa deja itilize");
  }
}

async function createAuthAccount(email, password, role, extraData = {}) {
  const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: { data: { role, ...extraData } }
  });
  if (error) throw error;
  return data.user;
}

async function insertProfile(user, payload) {
  const profile = {
    id: user.id,
    email: payload.email,
    phone: payload.phone,
    full_name: payload.full_name,
    role: payload.role,
    status: "pending"
  };

  await supabase.from("profiles").insert([profile]);
}

  const [errors, setErrors] = useState({});

  const set = (k, v) => {
    setForm(p => ({ ...p, [k]: v }));
    setErrors(p => ({ ...p, [k]: "" }));
  };

  const validate = () => {
    const e = {};
    if (!form.first_name) e.first_name = "Prenon obligatwa";

    const e = validate();

      return;

    setLoading(true);
    try {
      await uniqueCheck("customers", form.email, form.phone);

      const user = await createAuthAccount(form.email, form.password, "customer", {
        first_name: form.first_name,
        last_name: form.last_name

        city: form.city,
        state: form.state,
        zip: form.zip,
        id_document_url: idUrl,
        id_document_type: form.id_document_type,
        status: "pending",
        is_verified: false,
        is_active: true

      const { error: dbError } = await supabase.from("customers").insert([customerRow]);
      if (dbError) throw dbError;

      await insertProfile(user, {
        email: form.email,
        phone: form.phone,
        full_name: `${form.first_name} ${form.last_name}`,
        role: "customer"
      });

      await supabase.from("admin_approvals").insert([{
        applicant_id: user.id,
        applicant_type: "customer",
        applicant_name: `${form.first_name} ${form.last_name}`,
        status: "pending"
      }]);

      alert("✅ Kont kreye! Admin ap verifye kont ou.");
      window.location.href = "/auth";
    } catch (err) {

    }
    setLoading(false);

        <Field label="Telefòn" value={form.phone} onChange={v => set("phone", v)} type="tel" error={errors.phone} disabled={loading}/>

        <Field label="Adres" value={form.address} onChange={v => set("address", v)} error={errors.address} disabled={loading}/>
        <Field label="Apt / Suite" value={form.apartment} onChange={v => set("apartment", v)} disabled={loading}/>
        <Field label="Vil" value={form.city} onChange={v => set("city", v)} error={errors.city} disabled={loading}/>
        <Field label="ZIP" value={form.zip} onChange={v => set("zip", v)} error={errors.zip} disabled={loading}/>
      </Card>

      <Card title="💼 EIN" color="#1a6b3a">
        <Field label="EIN Number" value={form.ein_number} onChange={v => set("ein_number", v)} error={errors.ein_number} disabled={loading}/>
      </Card>

      <Card title="📄 Dokiman Obligatwa" color="#1a6b3a">
        <FileUpload label="ID / Lisans / Paspò Owner" bucket="restaurant-documents" path="owner-id" onUpload={u => setDocs(p => ({...p, id: u}))}/>
        {errors.id && <ErrorText text={errors.id}/>}
        <FileUpload label="Dokiman EIN" bucket="restaurant-documents" path="ein-doc" accept=".pdf,image/*" onUpload={u => setDocs(p => ({...p, ein: u}))}/>
        {errors.ein && <ErrorText text={errors.ein}/>}
        <FileUpload label="Menu PDF" bucket="restaurant-documents" path="menu" accept=".pdf,image/*" onUpload={u => setDocs(p => ({...p, menu: u}))}/>
        {errors.menu && <ErrorText text={errors.menu}/>}
        <FileUpload label="Logo Restoran Opsyonèl" bucket="restaurant-documents" path="logo" onUpload={u => setDocs(p => ({...p, logo: u}))}/>
      </Card>

      <button style={buttonStyle("linear-gradient(135deg,#1a6b3a,#0d4a28)")} onClick={submit} disabled={loading}>
        {loading ? "⏳ Ap soumèt..." : "🍴 Soumèt Aplikasyon"}
      </button>
    </Page>
  );
}

function SignIn({ onBack, onForgot }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);

  const login = async () => {
    if (!email || !password) {
      alert("Antre email ak password");
      return;
    }

    setLoading(true);
    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;

      let profile = null;

      const { data: p } = await supabase.from("profiles").select("*").eq("id", data.user.id).maybeSingle();
      profile = p;

      if (!profile) {
        const { data: c } = await supabase.from("customers").select("*").eq("auth_user_id", data.user.id).maybeSingle();
        if (c) profile = { role: "customer", status: c.status || (c.is_active ? "approved" : "pending") };
      }

      if (!profile) {
        const { data: d } = await supabase.from("drivers").select("*").eq("auth_user_id", data.user.id).maybeSingle();
        if (d) profile = { role: "driver", status: d.status || (d.is_active ? "approved" : "pending") };
      }

      if (!profile) {
        const { data: r } = await supabase.from("restaurants").select("*").eq("auth_user_id", data.user.id).maybeSingle();
        if (r) profile = { role: "restaurant", status: r.status || (r.is_active ? "approved" : "pending") };
      }

      if (!profile) {
        alert("Kont lan pa jwenn nan database la.");
        setLoading(false);
        return;
      }

      if (profile.status !== "approved" && profile.status !== "active") {
        alert("Kont ou poko apwouve. Admin dwe verifye li avan.");
        setLoading(false);
        return;
      }

      if (profile.role === "admin") {
        window.location.href = "/admin";
      } else {
        window.location.href = "/dashboard";
      }
    } catch (err) {
      alert("Erè login: " + err.message);
    }
    setLoading(false);
  };

  return (
    <Page title="🔐 Sign In" onBack={onBack}>
      <Card title="Antre nan kont ou" color={T.primary}>
        <Field label="Email" value={email} onChange={setEmail} type="email" disabled={loading}/>
        <Field label="Password" value={password} onChange={setPassword} type="password" disabled={loading}/>
        <button style={buttonStyle(`linear-gradient(135deg,${T.primary},${T.primaryDark})`)} onClick={login} disabled={loading}>
          {loading ? "⏳ Ap antre..." : "Sign In"}
        </button>
        <button style={buttonStyle("#fff", T.primary)} onClick={onForgot} disabled={loading}>
          Forgot Password
        </button>
      </Card>
    </Page>
  );
}

function ForgotPassword({ onBack }) {
  const [email, setEmail] = useState("");
  const [loading, setLoading] = useState(false);

  const send = async () => {
    if (!email) {
      alert("Antre email ou");
      return;
    }
    setLoading(true);
    try {
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: "https://rapiddelivri.vercel.app/auth"
      });
      if (error) throw error;
      alert("✅ Link reset password voye nan email ou.");
    } catch (err) {
      alert("Erè: " + err.message);
    }
    setLoading(false);
  };

  return (
    <Page title="🔑 Forgot Password" onBack={onBack}>
      <Card title="Reset password ou" color={T.primary}>
        <Field label="Email" value={email} onChange={setEmail} type="email" disabled={loading}/>
        <button style={buttonStyle(`linear-gradient(135deg,${T.primary},${T.primaryDark})`)} onClick={send} disabled={loading}>
          {loading ? "⏳ Ap voye..." : "Send Reset Link"}
        </button>
      </Card>
    </Page>
  );
}

function Card({ title, color, children }) {
  return (
    <div style={{ background: "#fff", borderRadius: 16, padding: 20, marginBottom: 14, border: `1px solid ${T.border}` }}>
      <div style={{ fontWeight: 900, color, marginBottom: 16 }}>{title}</div>
      {children}
    </div>
  );
}

function Page({ title, onBack, children }) {
  return (
    <div style={{ maxWidth: 480, margin: "0 auto", background: "#EEF2FF", minHeight: "100vh" }}>
      <Header title={title} onBack={onBack}/>
      <div style={{ padding: "16px 16px 100px" }}>
        {children}
      </div>
    </div>
  );
}

function ErrorText({ text }) {
  return <div style={{ color: T.accent, fontSize: 12, marginBottom: 8 }}>{text}</div>;
}

function Home({ setScreen }) {
  return (
    <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh", background: "linear-gradient(160deg, #003F87 0%, #002D63 45%, #D01C1F 100%)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ width: 150, height: 150, borderRadius: "50%", background: "#FFD700", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 42, fontWeight: 900, color: T.primary, border: "4px solid #fff", marginBottom: 18 }}>RD</div>
      <div style={{ color: "#fff", fontSize: 28, fontWeight: 900, marginBottom: 8 }}>Rapid Delivri</div>
      <div style={{ color: "#ffffffcc", fontSize: 14, marginBottom: 34 }}>Indianapolis Haitian Food Platform 🇭🇹</div>

      <div style={{ width: "100%", display: "flex", flexDirection: "column", gap: 14 }}>
        <button onClick={() => setScreen("signin")} style={{ ...buttonStyle("#FFD700", T.primary), marginTop: 0 }}>🔐 Sign In</button>
        <button onClick={() => setScreen("customer")} style={{ ...buttonStyle("#fff", T.primary), marginTop: 0 }}>👤 Mwen se Kliyan</button>
        <button onClick={() => setScreen("driver")} style={{ ...buttonStyle("transparent"), border: "2px solid #fff", marginTop: 0 }}>🚗 Mwen se Chofè</button>
        <button onClick={() => setScreen("restaurant")} style={{ ...buttonStyle("transparent"), border: "2px solid #FFD700", marginTop: 0 }}>🍴 Mwen se Restoran</button>
      </div>

      <div style={{ textAlign: "center", marginTop: 24, color: "#ffffff99", fontSize: 13 }}>
        Bliye password?{" "}
        <span style={{ color: "#FFD700", fontWeight: 800, cursor: "pointer" }} onClick={() => setScreen("forgot")}>
          Reset here
        </span>
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("home");
  const [ready, setReady] = useState(false);

  useEffect(() => {
    const ok = initSupabase();
    setReady(ok);
  }, []);

  if (!ready) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: T.primary, color: "#fff", fontWeight: 900 }}>
        ⏳ System Loading...
      </div>
    );
  }

  if (screen === "customer") return <CustomerRegister onBack={() => setScreen("home")}/>;
  if (screen === "driver") return <DriverRegister onBack={() => setScreen("home")}/>;
  if (screen === "restaurant") return <RestaurantRegister onBack={() => setScreen("home")}/>;
  if (screen === "signin") return <SignIn onBack={() => setScreen("home")} onForgot={() => setScreen("forgot")}/>;
  if (screen === "forgot") return <ForgotPassword onBack={() => setScreen("signin")}/>;

  return <Home setScreen={setScreen}/>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
